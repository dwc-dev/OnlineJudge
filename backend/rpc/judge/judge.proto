syntax = "proto3";

package judge;
option go_package = "./judge";

message JudgeReq {
  string code = 1;
  string language = 2;
  uint64 question_id =3;
}

message ExecResult {
  string output = 1;
  int64 time_milliseconds = 2;
  int64 memory_usage = 3;
  bool accepted = 4;
}

message JudgeResp {
  repeated ExecResult results = 1;
}

service Judge {
  rpc Judge (JudgeReq) returns (JudgeResp);
}