name: onlinejudge

services:
  # ==================== 基础设施 ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    environment:
      TZ: ${TZ}
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # ports:
    #   - "2379:2379"
    networks:
    - oj-net

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4
      - --default-time-zone=+08:00
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # ports:
    #   - "3306:3306"
    networks:
      - oj-net

  redis:
    image: redis:8.6-alpine
    environment:
      TZ: ${TZ}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ports:
    #   - "6379:6379"
    restart: unless-stopped
    networks:
    - oj-net

  minio:
    build:
      context: ..
      dockerfile: deploy/minio/Dockerfile
    environment:
      TZ: ${TZ}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    restart: unless-stopped
    networks:
    - oj-net

  # ==================== 判题沙箱镜像构建器 ====================
  sandbox-image-builder:
    image: docker:cli
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/sandbox/build-sandbox-images.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace:ro
      - ./sandbox/build-sandbox-images.sh:/sandbox/build-sandbox-images.sh:ro
    restart: "no"

  # ==================== 前端 ====================
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
      args:
        VITE_APP_API_BASE_URL: /api/v1
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - oj-net

  # ==================== Go 微服务 ====================
  user:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        SERVICE_ENTRY: ./microservices/user/user.go
        BINARY_NAME: user
    environment:
      TZ: ${TZ}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend-config/user.yaml.tpl:/app/templates/config.yaml.tpl:ro
    command: ["/usr/local/bin/user", "-f", "/app/etc/config.yaml"]
    restart: unless-stopped
    networks:
      - oj-net

  question:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        SERVICE_ENTRY: ./microservices/question/question.go
        BINARY_NAME: question
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./backend-config/question.yaml.tpl:/app/templates/config.yaml.tpl:ro
    command: ["/usr/local/bin/question", "-f", "/app/etc/config.yaml"]
    restart: unless-stopped
    networks:
      - oj-net

  judge:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        SERVICE_ENTRY: ./microservices/judge/judge.go
        BINARY_NAME: judge
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      question:
        condition: service_started
      sandbox-image-builder:
        condition: service_completed_successfully
    volumes:
      - ./backend-config/judge.yaml.tpl:/app/templates/config.yaml.tpl:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["/usr/local/bin/judge", "-f", "/app/etc/config.yaml"]
    restart: unless-stopped
    networks:
      - oj-net

  competition:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        SERVICE_ENTRY: ./microservices/competition/competition.go
        BINARY_NAME: competition
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      user:
        condition: service_started
      question:
        condition: service_started
      judge:
        condition: service_started
    volumes:
      - ./backend-config/competition.yaml.tpl:/app/templates/config.yaml.tpl:ro
    command: ["/usr/local/bin/competition", "-f", "/app/etc/config.yaml"]
    restart: unless-stopped
    networks:
      - oj-net

  # ==================== Python AI 服务 ====================
  ai:
    build:
      context: ..
      dockerfile: deploy/ai/Dockerfile
    environment:
      TZ: ${TZ}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: mysql:3306
      MYSQL_DATABASE: online_judge
      ETCD_HOST: etcd
      ETCD_PORT: "2379"
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      question:
        condition: service_started
    restart: unless-stopped
    networks:
      - oj-net

  # ==================== API 网关 ====================
  gateway:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        SERVICE_ENTRY: ./gateway/gateway.go
        BINARY_NAME: gateway
    environment:
      TZ: ${TZ}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      user:
        condition: service_started
      question:
        condition: service_started
      judge:
        condition: service_started
      competition:
        condition: service_started
      ai:
        condition: service_started
    volumes:
      - ./backend-config/gateway-api.yaml.tpl:/app/templates/config.yaml.tpl:ro
    command: ["/usr/local/bin/gateway", "-f", "/app/etc/config.yaml"]
    restart: unless-stopped
    networks:
      - oj-net

# ==================== 网络与持久化 ====================
volumes:
  etcd-data:
  mysql-data:
  redis-data:
  minio-data:

networks:
  oj-net:
    driver: bridge